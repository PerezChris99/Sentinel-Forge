name: SentinelForge CV Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read

jobs:
  cv-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[test,cv]"
      - run: pytest -q tests/test_detection.py tests/test_detection_pipeline.py
