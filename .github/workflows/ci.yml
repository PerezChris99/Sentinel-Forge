name: SentinelForge CI

on:
  push:
    branches: [main, Perez]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install application and test dependencies
        run: pip install -e ".[test]"

      - name: Run tests with branch coverage
        run: coverage run --branch -m pytest -q

      - name: Report coverage
        run: coverage report -m

      - name: Compile Python sources
        run: python -m compileall -q api analytics dashboard db detection

      - name: Validate Compose configuration
        run: touch .env && docker compose config -q

  lint:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.8,<1"
      - name: Lint hardened modules
        run: >-
          ruff check api/auth.py api/tasks.py api/websocket.py detection/sources.py
          dashboard/services/api_client.py api/runtime.py api/audit.py api/privacy.py
          tests/test_runtime.py tests/test_health.py tests/test_api_security.py
          tests/test_dashboard_contract.py tests/test_input_validation.py
          tests/test_runtime_boundaries.py tests/test_websocket_security.py
          tests/test_sources.py tests/test_models_contract.py tests/test_tasks.py
          tests/test_http_security.py --select E,F --ignore E501,E402 --output-format=github

      - name: Check undefined names in larger legacy modules
        run: >-
          ruff check api/main.py api/extended.py --select F821 --output-format=github
