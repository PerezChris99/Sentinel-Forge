name: SentinelForge CI

on:
  push:
    branches: [main, Perez]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install application and test dependencies
        run: pip install -e ".[test,cv]"

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q api analytics dashboard db detection

  lint:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.8,<1"
      - run: ruff check api/runtime.py api/audit.py api/privacy.py api/main.py api/auth.py db/models.py analytics/tasks.py tests/test_runtime.py tests/test_health.py --output-format=github
