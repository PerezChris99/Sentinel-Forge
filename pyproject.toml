[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "SentinelForge CCTV intelligence platform"
requires-python = ">=3.11"
authors = [{name = "SentinelForge Team"}]
dependencies = [
    "dash>=2.15",
    "plotly>=5.22",
    "dash-bootstrap-components>=1.5",
    "python-socketio[client]>=5.11",
    "requests>=2.32",
    "pydantic>=2.8",
    "tenacity>=8.2",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "pandas>=2.1",
    "numpy>=1.26"
]

[project.optional-dependencies]
cv = [
    "opencv-python>=4.10",
    "dlib>=19.24",
    "face-recognition>=1.3",
    "scikit-learn>=1.4"
]
backend = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "timescaledb-toolkit",
    "pgvector"
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "dash[testing]>=2.15"
]

[tool.setuptools.packages.find]
where = ["src", "api", "dashboard", "detection", "analytics"]
