[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "1.0.0"
description = "Production-oriented CCTV intelligence and security operations platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-socketio[asyncio]>=5.11,<6",
  "pydantic>=2.8,<3",
  "pydantic[email]>=2.8,<3",
  "python-jose[cryptography]>=3.3,<4",
  "cryptography>=42,<47",
  "bcrypt>=4.1,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "pgvector>=0.2,<1",
  "redis>=5,<8",
  "celery>=5.4,<6",
  "slowapi>=0.1,<1",
  "python-multipart>=0.0.9,<1",
  "aiofiles>=23,<25",
  "requests>=2.32,<3",
  "tenacity>=8.2,<10",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "reportlab>=4,<5",
  "dash>=2.15,<4",
  "dash-bootstrap-components>=1.5,<2",
  "plotly>=5.22,<7"
]

[project.optional-dependencies]
cv = [
  "opencv-python-headless>=4.10,<5",
  "face-recognition>=1.3,<2"
]
yolo = ["ultralytics>=8.3,<9"]
ocr = ["easyocr>=1.7,<2"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "coverage[toml]>=7.6,<8"
]
dev = [
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5"
]

[tool.setuptools.packages.find]
include = ["api*", "analytics*", "dashboard*", "db*", "detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["E501"]
